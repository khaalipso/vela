<style>
/* Layout: one focused surface per space. A slim space rail, a single "Up next" island, contextual key hints. Nothing docked that you did not ask for. */
:root{
  --bg:#000000; --rail:#131209; --panel:#181818; --raised:#1F1F1F; --hover:#272727; --line:#313131;

  --add:#15803D; --add-bg:rgba(22,163,74,.12); --del:#B91C1C; --del-bg:rgba(220,38,38,.10);

:root[data-theme="light"]{

  --add:#15803D; --add-bg:rgba(22,163,74,.12); --del:#B91C1C; --del-bg:rgba(220,38,38,.10);

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:20px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
kbd{font-family:var(--code);font-size:11px;line-height:16px;padding:0 5px;border-radius:4px;background:var(--hover);color:var(--fg);white-space:nowrap}

.app{height:100%;display:flex;gap:8px;padding:8px 16px}

.find:hover{background:var(--line)}
.find span{flex:1;text-align:left}
.label{font-size:12px;font-weight:500;color:var(--faint);padding:4px 8px 0;letter-spacing:.01em}

.newsp{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;color:var(--faint);transition:background-color 240ms var(--ease)}
.newsp:hover{background:var(--hover);color:var(--fg)}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;background:color-mix(in srgb,var(--panel) 60%,transparent);font-size:12px;color:var(--faint)}
.railfoot div{display:flex;align-items:center;gap:6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;position:relative}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:44px;padding:4px 4px 0}
.top h1{margin:0;font-size:18px;line-height:28px;font-weight:600;display:flex;align-items:center;gap:10px}
.top h1 .dot{width:10px;height:10px;background:var(--space)}

.views button{height:30px;padding:0 10px;border-radius:7px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;transition:background-color 240ms var(--ease),color 240ms var(--ease)}
.views button[aria-pressed="true"]{background:var(--hover);color:var(--fg);font-weight:600}
.views button .n{font-size:11px;font-weight:600;color:var(--space)}

.body{flex:1;min-height:0;display:flex;gap:8px}
.surface{flex:1;min-width:0;background:var(--panel);border-radius:16px;overflow:auto;position:relative;padding-bottom:96px}
.surface.enter{animation:enter 320ms var(--ease)}

/* Changes drawer */
.changes{width:280px;flex:none;background:var(--panel);border-radius:16px;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:enter 320ms var(--ease)}
.grp h3{margin:0 0 4px;padding:0 6px;font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.grp h3 span{color:var(--faint);font-weight:500}
.frow{width:100%;display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;font-size:12px;text-align:left;transition:background-color 200ms var(--ease)}

.frow .rp{font-size:11px;color:var(--faint);padding:0 5px;border-radius:4px;background:var(--raised)}

.frow .st{font-family:var(--code);font-weight:600;color:var(--c)}
.empty{font-size:12px;color:var(--faint);padding:2px 6px}

/* Review */
.rv{max-width:920px;margin:0 auto;padding:20px 20px 0;display:flex;flex-direction:column;gap:10px}
.rvhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 4px 6px}
.rvhead h2{margin:0;font-size:16px;font-weight:600}
.bar{flex:1;min-width:120px;height:4px;border-radius:9999px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--space);transition:width 400ms var(--ease)}
.counts{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.hunk{background:var(--raised);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px transparent;transition:box-shadow 240ms var(--ease),opacity 240ms var(--ease)}
.hunk.focus{box-shadow:0 0 0 2px var(--space)}
.hunk .hh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--muted)}
.hunk .hh b{color:var(--fg);font-weight:600;font-size:13px}
.hunk .hh .loc{font-family:var(--code);color:var(--faint)}
.hunk .hh .keys{margin-left:auto;display:flex;gap:10px;align-items:center}
.hunk .why{padding:0 14px 10px;font-size:13px;color:var(--fg)}
.diff{font-family:var(--code);font-size:13px;line-height:22px;overflow-x:auto;padding-bottom:8px}
.dl{display:flex;gap:12px;padding-right:16px;white-space:pre}
.dl .g{width:44px;flex:none;text-align:right;color:var(--gutter);user-select:none}
.dl .s{width:10px;flex:none;user-select:none}

.allclear{padding:56px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--muted)}
.allclear h3{margin:0;color:var(--fg);font-size:18px;font-weight:600}

.tabs{display:flex;gap:4px;padding:8px;position:sticky;top:0;background:var(--panel);z-index:2;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:8px;font-size:12px;color:var(--faint);white-space:nowrap;transition:background-color 200ms var(--ease)}

.inline.focus{box-shadow:0 0 0 2px var(--space)}
.inline .ib{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;font-family:var(--ui);font-size:12px;color:var(--muted)}
.inline .ib b{color:var(--fg);font-weight:600}
.inline .ib .keys{margin-left:auto;display:flex;gap:10px}
.inline .dl .g{width:0;display:none}

.ag{max-width:820px;margin:0 auto;padding:20px 20px 0;display:flex;flex-direction:column;gap:10px}
.ask{background:var(--raised);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 2px var(--space)}
.ask p{margin:0;font-size:15px;line-height:22px}
.ask .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:32px;padding:0 12px;border-radius:8px;background:var(--hover);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:8px;transition:background-color 200ms var(--ease),transform 200ms var(--ease)}
.btn:hover{background:var(--line)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--space);color:var(--on-accent)}
.btn.p:hover{filter:brightness(1.08)}
.btn.p kbd{background:rgba(0,0,0,.18);color:var(--on-accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.agent{background:var(--raised);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.agent .who{font-weight:600}
.agent .who span{font-weight:400;color:var(--faint);font-size:12px;margin-left:6px}
.agent .stt{font-size:12px;color:var(--c)}
.agent .txt{grid-column:2/4;font-size:13px;color:var(--fg)}
.agent .wt{grid-column:2/4;font-family:var(--code);font-size:12px;color:var(--faint)}
.pulse{animation:pulse 1.4s var(--ease) infinite}
@keyframes pulse{50%{opacity:.35}}

/* Island */
.island{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:12px;max-width:min(640px,calc(100% - 32px));padding:10px 10px 10px 16px;border-radius:9999px;background:var(--hover);box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px var(--line);text-align:left;transition:transform 320ms var(--ease),background-color 240ms var(--ease)}

.island .go{flex:none;height:32px;padding:0 12px;border-radius:9999px;background:var(--space);color:var(--on-accent);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}

.bottom{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:32px;padding:0 6px;font-size:12px;color:var(--faint)}

.composer{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);z-index:6;width:min(640px,calc(100% - 32px));background:var(--hover);border-radius:18px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.35),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:10px;animation:pop 260ms var(--ease)}

.role{height:26px;padding:0 10px;border-radius:9999px;background:var(--panel);font-size:12px;color:var(--muted)}

.pop{position:absolute;right:6px;bottom:40px;z-index:7;width:300px;background:var(--panel);border-radius:14px;padding:10px;box-shadow:0 12px 40px rgba(0,0,0,.4),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px;animation:pop 240ms var(--ease)}

.elsewhere{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center;padding:24px}
.elsewhere h3{margin:0;color:var(--fg);font-size:18px}

@media (max-width: 760px){
  body{overflow:auto}
  .app{flex-direction:column;height:auto;min-height:100%}

  .spaces{flex-direction:row;overflow-x:auto}
  .sp{flex:none}
  .railfoot,.label{display:none}
  .body{flex-direction:column;min-height:70vh}
  .changes{width:auto}
  .hints{display:none}
  .views{margin-left:0}
  .island{position:sticky;transform:none;left:auto;bottom:8px;margin:0 auto;max-width:100%}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

  var a=[["Up next: "+upNext(sp).t,"Enter",function(){upNext(sp).act()}],["Go to review","2",function(){setView("review")}],["Go to code","1",function(){setView("code")}],["Go to agents","3",function(){setView("agents")}],["Ask an agent","@",openComposer],["Commit and push","C",openCommit],["New space","",function(){S.overlay="newspace";render()}],["Open this space in its own window","W",toggleWindow],["Toggle changes","B",function(){S.changes=!S.changes;render()}],["Show the stack","S",function(){S.stackOpen=true;render()}],["All shortcuts","?",function(){S.overlay="help";render()}]];
  a.forEach(function(x){it.push({sec:"Actions",t:x[0],k:x[1],run:x[2]})});
  spaces.forEach(function(s,i){it.push({sec:"Spaces",t:s.name,sub:s.branch,dot:s.color,k:i<9?"Alt "+(i+1):"",run:function(){goSpace(i)}})});
  spaces.forEach(function(s,i){Object.keys(s.files).forEach(function(id){var f=s.files[id];it.push({sec:"Files",t:f.path,sub:s.name+" · "+f.repo,dot:s.color,run:function(){S.sp=i;s.view="code";s.file=id;S.overlay=null;render()}})})});
  var q=S.pal.q.toLowerCase().trim();
  if(q)it=it.filter(function(x){var hay=(x.t+" "+(x.sub||"")).toLowerCase();return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0})});
  return it;
}
function palette(){
  return '<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Command bar"><div class="pin"><svg width="18" height="18" viewBox="0 0 256 256" fill="none" stroke="var(--faint)" stroke-width="20" stroke-linecap="round" aria-hidden="true"><circle cx="112" cy="112" r="72"></circle><path d="M163 163l53 53"></path></svg><label for="pal-in" style="position:absolute;left:-9999px">Search</label><input id="pal-in" autocomplete="off" placeholder="Jump to a space, a file, or run an action"></div><div class="plist" id="pal-list" role="listbox"></div><div class="pfoot"><span>'+K("↑")+K("↓")+' move</span><span>'+K("Enter")+' run</span><span>'+K("Esc")+' close</span></div></div></div>';
}
var palCache=[];
function drawPal(){
  palCache=paletteItems();var el=document.getElementById("pal-list");if(!el)return;
  if(S.pal.i>=palCache.length)S.pal.i=Math.max(0,palCache.length-1);
  var h="",sec="";
  if(!palCache.length)h='<div class="empty" style="padding:16px">No match. Try a file name, a space, or “commit”.</div>';
  palCache.forEach(function(x,i){if(x.sec!==sec){sec=x.sec;h+='<div class="psec">'+sec+'</div>'}
    h+='<button class="pit" role="option" data-pi="'+i+'" aria-selected="'+(i===S.pal.i)+'">'+(x.dot?'<span class="dot" style="--c:'+x.dot+'"></span>':'<span class="dot" style="--c:var(--line)"></span>')+'<span class="t">'+esc(x.t)+(x.sub?'<small>'+esc(x.sub)+'</small>':'')+'</span>'+(x.k?K(x.k):'')+'</button>'});
  el.innerHTML=h;
  el.querySelectorAll("[data-pi]").forEach(function(b){b.addEventListener("click",function(){runPal(+b.dataset.pi)})});
  var s=el.querySelector('[aria-selected="true"]');if(s)s.scrollIntoView({block:"nearest"});
}
function runPal(i){var x=palCache[i];if(!x)return;S.overlay=null;S.pal.q="";x.run();render()}
function newSpace(){
  return '<div class="scrim" data-close><form class="sheet" id="ns-form" role="dialog" aria-label="New space"><div class="form"><div style="font-size:16px;font-weight:600">New space</div><div style="display:flex;flex-direction:column;gap:6px"><label for="ns-name">What are you working on?</label><input class="field" id="ns-name" autocomplete="off" placeholder="Refunds in checkout"></div><div style="display:flex;flex-direction:column;gap:6px"><label>Repos for this task</label><div class="repos">'+REPOS.map(function(r){return '<button type="button" class="rtog" data-repo="'+r+'" aria-pressed="'+(S.newSp.repos.indexOf(r)>=0)+'">'+r+'</button>'}).join("")+'</div></div><div class="cost">Vela creates one branch and one worktree per repo, then starts the stack from mise.toml and compose.yml.</div><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn" data-close-btn>Cancel</button><button type="button" class="btn p" id="ns-go">Create space '+K("Ctrl Enter")+'</button></div></div></form></div>';
}
function gateChecks(sp){
  var bn=blockingNotes(sp).length,t=sp.tests;
  return [["Reviewer",bn?bn+" blocking":"no blocking notes",!bn],["Tests touched by the diff",t.pass+" of "+t.total,t.pass===t.total],["Lint and types","clean",true],["Secrets and .env","clean",true],["Repo rules","AGENTS.md",true]];
}
function gateOk(){var g=S.gate;return g&&g.done>=5&&(g.checks.every(function(c){return c[2]})||(g.reason||"").trim().length>3)}
function commitSheet(){
  var sp=cur(),g=S.gate,files=stagedFiles(sp),repos=uniq(files.map(function(f){return f.repo}));
  var h='<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Commit gate"><div class="form"><div style="display:flex;align-items:center;gap:10px"><span class="dot" style="--c:'+sp.color+'"></span><span style="font-size:16px;font-weight:600">Commit '+esc(sp.name)+'</span><span class="cost" style="margin-left:auto">'+files.length+' files · '+repos.join(", ")+'</span></div><ul class="checks">';
  g.checks.forEach(function(c,i){var st=i<g.done?(c[2]?"pass":"fail"):"run";var col=st==="pass"?"var(--add)":st==="fail"?"var(--del)":"var(--faint)";
    h+='<li><span class="dot'+(st==="run"?" pulse":"")+'" style="--c:'+col+'"></span><span>'+c[0]+'</span><em style="--c:'+col+'">'+(st==="run"?"checking":c[1])+'</em></li>'});
  h+='</ul><div class="cost">Reads the staged diff only, in parallel. Blocks already reviewed come from cache.</div>';
  if(pending(sp).length)h+='<div class="blocked">'+pending(sp).length+' proposals are still unreviewed and will not be committed.</div>';
  h+='<div style="display:flex;flex-direction:column;gap:6px"><label for="msg-in">Message</label><textarea class="field mono" id="msg-in" rows="4">'+esc(sp.commitMsg)+'</textarea></div>';
  var fails=g.done>=5&&!g.checks.every(function(c){return c[2]});
  if(fails)h+='<div style="display:flex;flex-direction:column;gap:6px"><label for="ov-in" style="color:var(--del)">Blocked. Fix it with F in review, or give a reason to override</label><input class="field" id="ov-in" autocomplete="off" placeholder="Hotfix, tests are flaky on CI" value="'+esc(g.reason||"")+'"></div>';
  h+='<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close-btn>Cancel</button><button class="btn p" data-commit '+(gateOk()?"":"disabled")+'>Commit and push '+repos.length+(repos.length>1?" repos":" repo")+' '+K("Ctrl Enter")+'</button></div></div></div></div>';
  return h;
}
function help(){
  var g=[["Anywhere",[["Ctrl K","Spaces, files, actions"],["Enter","Do what is up next"],["Shift Enter","Next space waiting for you"],["[  ]","Previous, next space"],["Alt 1 to 9","Jump to space"],["W","Open space in its own window"],["1  2  3","Code, review, agents"],["B","Changes drawer"],["S","Stack and containers"],["@","Ask an agent"],["C","Commit and push"],["?","This sheet"]]],["On a proposal",[["J  K","Next, previous"],["Y","Accept"],["N","Reject"],["E","Accept and edit by hand"],["F","Ask the author to fix the note"],["U","Undo"]]],["In the editor",[["Click","Type anywhere, your lines get a blue mark"],["Esc","Leave the line, keys work again"]]]];
  var h='<div class="scrim" data-close><div class="sheet" role="dialog" aria-label="Shortcuts" style="max-width:720px"><div class="help">';
  g.forEach(function(s){h+='<h4>'+s[0]+'</h4>';s[1].forEach(function(r){h+='<div><span>'+r[1]+'</span>'+K(r[0])+'</div>'})});
  return h+'</div><div class="pfoot"><span>In the desktop app these use Ctrl, here they are single keys like in Linear or Gmail</span></div></div></div>';
}

/* ---------- Actions ---------- */
function setView(v){cur().view=v;S.overlay=null;render()}
function goSpace(i){if(i<0||i>=spaces.length)return;S.sp=i;S.overlay=null;S.stackOpen=false;render()}
function toast(t){S.toast=t;var el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},2400)}
function shift(sp,h,delta){sp.hunks.forEach(function(o){if(o!==h&&o.file===h.file&&o.at>h.at)o.at+=delta})}
function apply(sp,h){var f=sp.files[h.file];f.lines.splice.apply(f.lines,[h.at,h.del.length].concat(h.add));shift(sp,h,h.add.length-h.del.length)}
function unapply(sp,h){var f=sp.files[h.file];f.lines.splice.apply(f.lines,[h.at,h.add.length].concat(h.del));shift(sp,h,h.del.length-h.add.length)}
function focusHunk(){var sp=cur();return sp.hunks[sp.hi]}
function nextPendingIndex(sp,from){for(var j=1;j<=sp.hunks.length;j++){var k=(from+j)%sp.hunks.length;if(sp.hunks[k].state==="pending")return k}return from}
function visibleHunks(sp){return sp.hunks.map(function(h,i){return i}).filter(function(i){return sp.view!=="code"||(sp.hunks[i].file===sp.file&&sp.hunks[i].state==="pending")})}
function move(d){var sp=cur(),v=visibleHunks(sp);if(!v.length){if(sp.view==="code"){var p=pending(sp)[0];if(p){sp.file=p.file;sp.hi=sp.hunks.indexOf(p);render()}}return}var k=v.indexOf(sp.hi);k=k<0?0:Math.min(v.length-1,Math.max(0,k+d));sp.hi=v[k];render()}
function decide(kind){
  var sp=cur(),h=focusHunk();if(!h||h.state!=="pending")return;
  if(kind==="accept"){apply(sp,h);h.state="accepted"}
  if(kind==="reject"){h.state="rejected"}
  if(kind==="edit"){apply(sp,h);h.state="edited";sp.view="code";sp.file=h.file;render();
    var el=app.querySelector('.t[data-line="'+h.at+'"]');if(el){el.focus();placeEnd(el)}toast("Accepted. Edit the lines, then Esc");return}
  sp.hi=nextPendingIndex(sp,sp.hi);
  if(!pending(sp).length)toast(readyToCommit(sp)?"All reviewed. Press C to commit":"All reviewed");
  render();
}
function undo(){var sp=cur(),h=focusHunk();if(!h||h.state==="pending")return;if(h.state!=="rejected")unapply(sp,h);h.state="pending";render()}
function placeEnd(el){try{var r=document.createRange();r.selectNodeContents(el);r.collapse(false);var s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}}
function askFix(i){
  var sp=cur(),h=sp.hunks[i==null?sp.hi:i];if(!h||!h.note||h.note.resolved||h.note.busy)return;
  h.note.busy=true;var agent=sp.agents.filter(function(a){return a.role===h.role})[0];if(agent){agent.status="working";agent.text="Fixing: "+h.note.text.split(".")[0]}render();
  setTimeout(function(){
    if(h.state==="accepted"||h.state==="edited"){var nh={id:h.id+"f",file:h.file,at:h.at,del:h.add.slice(),add:h.note.fix,role:h.role,tool:h.tool,why:"Fix from review: return 400 on a bad signature.",state:"pending"};sp.hunks.splice(sp.hunks.indexOf(h)+1,0,nh)}
    else{h.add=h.note.fix;h.why="Updated after review: catch the bad signature and return 400."}
    h.note.resolved=true;h.note.busy=false;sp.tests.pass=sp.tests.total;
    if(agent){agent.status="done";agent.text="Fix ready, tests "+sp.tests.total+" of "+sp.tests.total}
    sp.agents.forEach(function(a){if(a.role==="Tester"){a.status="done";a.text=sp.tests.total+" of "+sp.tests.total+" tests pass"}if(a.role==="Reviewer"){a.text="No blocking notes"}});
    toast(h.tool+" updated the proposal");render()},1400);
}
function answer(yes){
  var sp=cur();if(!sp.question)return;var q=sp.question;sp.question=null;
  sp.agents.forEach(function(a){if(a.status==="waiting"){a.status="working";a.text=yes?"Keeping pg_trgm, adding it to the image init script":"Dropping pg_trgm and the fuzzy index"}});
  toast("Sent to "+q.by.split(" · ")[1]);
  setTimeout(function(){sp.hunks.push({id:"p3",file:"mig",at:yes?0:1,del:yes?[]:["CREATE EXTENSION IF NOT EXISTS pg_trgm;","CREATE INDEX customers_name_trgm ON customers USING gin (name gin_trgm_ops);"],add:yes?["-- requires pg_trgm, installed by infra/initdb/10_ext.sql"]:["-- pg_trgm dropped with Postgres 17, see chore/pg17"],role:"Developer",tool:"Crush",why:yes?"Document where the extension now comes from.":"Remove the extension and its index.",state:"pending"});
    sp.agents.forEach(function(a){if(a.tool==="Crush"){a.status="done";a.text="1 new proposal"}});render()},1600);
  render();
}
function openComposer(){S.overlay="composer";render()}
function sendComposer(){
  var ta=document.getElementById("cmp-in"),t=(ta&&ta.value||"").trim();if(!t){ta&&ta.focus();return}
  var sp=cur(),role=S.role,tool=role==="Reviewer"?"Codex":role==="Tester"?"opencode":"Claude Code";
  var wt=sp.repos[0].name+" · wt/"+sp.branch.split("/").pop()+"-"+role.toLowerCase();
  var ag={role:role,tool:tool,wt:wt,status:"working",text:t};sp.agents.unshift(ag);S.overlay=null;toast(role+" started in "+wt);render();
  setTimeout(function(){
    var fid=Object.keys(sp.files)[0],f=sp.files[fid],ext=f.path.split(".").pop(),c=ext==="yml"?"#":ext==="sql"?"--":"//";
    var at=Math.max(0,f.lines.length-1);
    sp.hunks.push({id:"c"+Date.now(),file:fid,at:at,del:[],add:["  "+c+" "+t],role:role,tool:tool,why:"Draft for: "+t,state:"pending"});
    ag.status="done";ag.text="1 proposal ready: "+t;sp.committed=false;render()},2200);
}
function openCommit(){
  var sp=cur();if(!stagedFiles(sp).length){toast("Nothing staged yet. Accept a proposal with Y");return}
  S.gate={checks:gateChecks(sp),done:0,reason:""};S.overlay="commit";render();
  var step=function(){if(S.overlay!=="commit"||!S.gate)return;S.gate.done++;var m=document.getElementById("msg-in");if(m)cur().commitMsg=m.value;renderLayer();if(S.gate.done<5)setTimeout(step,220)};setTimeout(step,260);
}
function doCommit(){
  if(!gateOk())return;var sp=cur(),m=document.getElementById("msg-in");if(m)sp.commitMsg=m.value;
  var repos=uniq(stagedFiles(sp).map(function(f){return f.repo}));
  sp.hunks=sp.hunks.filter(function(h){return h.state==="pending"});sp.baseStaged=[];sp.mine={};sp.committed=true;sp.hi=0;S.overlay=null;S.gate=null;
  toast("Pushed "+repos.join(" and ")+" on "+sp.branch);render();
}
function createSpace(){
  var n=(S.newSp.name||"").trim();if(!n){var el=document.getElementById("ns-name");el.focus();el.placeholder="Give the space a name first";return}
  if(!S.newSp.repos.length){toast("Pick at least one repo");return}
  var slug=n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24)||"task";
  var pal=["#E8A14A","#7DB8F5","#C9A0F0","#4ADE80","#F0A3C0","#9BD0C8"];
  var sp={id:slug,name:n,color:pal[spaces.length%pal.length],branch:"feat/"+slug,win:1,view:"agents",hi:0,
    repos:S.newSp.repos.map(function(r){return {name:r,wt:"wt/"+slug}}),stack:[["mise","detecting","warn"]],tests:{pass:0,total:0},baseStaged:[],commitMsg:"feat: "+n.toLowerCase(),
    files:{n0:{repo:S.newSp.repos[0],path:"README.md",from:1,lines:["# "+S.newSp.repos[0],""]}},file:"n0",hunks:[],agents:[{role:"Planner",tool:"Claude Code",wt:"read only",status:"working",text:"Reading the repos to split the task"}],question:null,mine:{}};
  spaces.push(sp);S.sp=spaces.length-1;S.overlay=null;S.newSp={name:"",repos:["api"]};
  toast("Created "+sp.repos.length+(sp.repos.length>1?" worktrees":" worktree")+" on "+sp.branch);render();
  setTimeout(function(){sp.stack=[["node 22.11","mise","ok"]];sp.agents[0].status="done";sp.agents[0].text="Plan ready: 3 steps. Ask the Developer to start with @";render()},1800);
}
function toggleWindow(){var sp=cur();if(sp.win===1){sp.win=2;toast(sp.name+" moved to window 2")}else{sp.win=1;toast(sp.name+" is back in this window")}S.overlay=null;render()}

/* ---------- Events ---------- */
function bind(){
  app.querySelectorAll("[data-sp]").forEach(function(b){b.addEventListener("click",function(){goSpace(+b.dataset.sp)})});
  app.querySelectorAll("[data-view]").forEach(function(b){b.addEventListener("click",function(){setView(b.dataset.view)})});
  app.querySelectorAll("[data-file]").forEach(function(b){b.addEventListener("click",function(){var sp=cur();sp.file=b.dataset.file;sp.view="code";render()})});
  app.querySelectorAll("[data-h]").forEach(function(b){b.addEventListener("click",function(e){if(e.target.closest("button"))return;cur().hi=+b.dataset.h;render()})});
  app.querySelectorAll("[data-fix]").forEach(function(b){b.addEventListener("click",function(){askFix(+b.dataset.fix)})});
  app.querySelectorAll("[data-ans]").forEach(function(b){b.addEventListener("click",function(){answer(b.dataset.ans==="yes")})});
  app.querySelectorAll("[data-role]").forEach(function(b){b.addEventListener("click",function(){S.role=b.dataset.role;app.querySelectorAll("[data-role]").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.role===S.role)});document.getElementById("cmp-in").focus()})});
  app.querySelectorAll("[data-act]").forEach(function(b){b.addEventListener("click",function(){var a=b.dataset.act;
    if(a==="palette"){S.overlay="palette";S.pal={q:"",i:0};render()}
    if(a==="newspace"){S.overlay="newspace";render()}
    if(a==="next")upNext(cur()).act();
    if(a==="composer")openComposer();
    if(a==="stack"){S.stackOpen=!S.stackOpen;render()}
    if(a==="window")toggleWindow();})});
  app.querySelectorAll(".t[contenteditable]").forEach(function(el){el.addEventListener("input",function(){var sp=cur(),i=+el.dataset.line;sp.files[sp.file].lines[i]=el.textContent;sp.mine[sp.file]=sp.mine[sp.file]||{};var was=sp.mine[sp.file][i];sp.mine[sp.file][i]=true;if(!was){var ln=el.closest(".ln");ln.classList.add("mine");ln.querySelector(".s").textContent="•";sp.baseStaged=sp.baseStaged}})});
}
document.addEventListener("click",function(e){if(e.target.closest("[data-close-btn]")){e.preventDefault();S.overlay=null;S.gate=null;render()}});
document.addEventListener("keydown",function(e){
  var t=e.target,typing=t&&(t.isContentEditable||/^(INPUT|TEXTAREA)$/.test(t.tagName)),k=e.key,ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&(k==="k"||k==="K")){e.preventDefault();S.overlay=S.overlay==="palette"?null:"palette";S.pal={q:"",i:0};render();return}
  if(k==="Escape"){if(S.overlay||S.stackOpen){S.overlay=null;S.gate=null;S.stackOpen=false;render()}else if(typing){t.blur()}return}
  if(S.overlay==="palette"){if(k==="ArrowDown"){e.preventDefault();S.pal.i=Math.min(palCache.length-1,S.pal.i+1);drawPal()}else if(k==="ArrowUp"){e.preventDefault();S.pal.i=Math.max(0,S.pal.i-1);drawPal()}else if(k==="Enter"){e.preventDefault();runPal(S.pal.i)}return}
  if(S.overlay==="newspace"){if(k==="Enter"&&ctrl){e.preventDefault();createSpace()}return}
  if(S.overlay==="commit"){if(k==="Enter"&&ctrl){e.preventDefault();doCommit()}return}
  if(S.overlay==="composer"){if(k==="Tab"){e.preventDefault();var R=["Developer","Reviewer","Tester","Planner","Debugger"];S.role=R[(R.indexOf(S.role)+(e.shiftKey?R.length-1:1))%R.length];app.querySelectorAll("[data-role]").forEach(function(x){x.setAttribute("aria-pressed",x.dataset.role===S.role)})}else if(k==="Enter"&&!e.shiftKey){e.preventDefault();sendComposer()}return}
  if(S.overlay==="help"){if(k==="?"){S.overlay=null;render()}return}
  if(typing)return;
  if(e.altKey&&/^[1-9]$/.test(k)){e.preventDefault();goSpace(+k-1);return}
  if(e.altKey&&/^Digit[1-9]$/.test(e.code)){e.preventDefault();goSpace(+e.code.slice(5)-1);return}
  if(ctrl||e.altKey)return;
  var sp=cur(),handled=true;
  switch(k){
    case "Enter": if(e.shiftKey){var n=nextWaitingSpace();if(n!==null)goSpace(n);else toast("No other space is waiting for you")}else upNext(sp).act();break;
    case "1": setView("code");break;
    case "2": setView("review");break;
    case "3": setView("agents");break;
    case "[": goSpace((S.sp-1+spaces.length)%spaces.length);break;
    case "]": goSpace((S.sp+1)%spaces.length);break;
    case "j": case "J": case "ArrowDown": if(sp.view==="agents"){handled=false;break}move(1);break;
    case "k": case "K": case "ArrowUp": if(sp.view==="agents"){handled=false;break}move(-1);break;
    case "y": case "Y": if(sp.view==="agents"&&sp.question)answer(true);else decide("accept");break;
    case "n": case "N": if(sp.view==="agents"&&sp.question)answer(false);else decide("reject");break;
    case "e": case "E": decide("edit");break;
    case "f": case "F": askFix();break;
    case "u": case "U": undo();break;
    case "b": case "B": S.changes=!S.changes;render();break;
    case "s": case "S": S.stackOpen=!S.stackOpen;render();break;
    case "c": case "C": openCommit();break;
    case "w": case "W": toggleWindow();break;
    case "@": openComposer();break;
    case "?": S.overlay="help";render();break;
    default: handled=false;
  }
  if(handled)e.preventDefault();
});
render();
})();
</script>
