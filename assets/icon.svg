<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26241b"/>
      <stop offset="1" stop-color="#0e0d09"/>
    </linearGradient>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6C27A"/>
      <stop offset="1" stop-color="#E08A2E"/>
    </linearGradient>
    <linearGradient id="jib" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE3BC"/>
      <stop offset="1" stop-color="#EBB06A"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7DB8F5" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#7DB8F5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7DB8F5" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- macOS grid: 824 px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- main sail -->
  <path d="M498 226 C 600 330, 664 480, 676 676 L 498 676 Z" fill="url(#main)"/>
  <!-- jib -->
  <path d="M470 280 C 410 400, 360 540, 330 676 L 470 676 Z" fill="url(#jib)"/>
  <!-- hull -->
  <path d="M300 712 L 724 712 C 700 770, 640 796, 560 796 L 440 796 C 372 796, 322 770, 300 712 Z" fill="#E8A14A"/>
  <!-- sea -->
  <path d="M232 836 C 300 816, 360 856, 430 836 S 560 816, 630 836 S 740 856, 792 836" fill="none" stroke="url(#sea)" stroke-width="18" stroke-linecap="round"/>
</svg>
