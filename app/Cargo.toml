[package]
name = "vela-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vela desktop app: Tauri shell over vela-core"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vela-core = { path = "../crates/vela-core" }
vela-agents = { path = "../crates/vela-agents" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
notify = "8"
notify-debouncer-mini = "0.7"
tauri-plugin-opener = "2.7.2"
trash = "5"
toml.workspace = true
tauri-plugin-notification = "2"
portable-pty = "0.9.0"

[features]
# Serves the built UI from ui/dist instead of the dev server. Enabled by scripts/build.sh.
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
