[workspace]
resolver = "2"
members = ["crates/vela-core", "crates/vela-agents", "crates/vela-cli", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
